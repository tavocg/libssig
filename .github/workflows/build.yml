name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure
        run: nix develop --command cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: nix develop --command cmake --build build --parallel

      - name: Test
        run: nix develop --command ctest --test-dir build --output-on-failure
